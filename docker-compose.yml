# Postgres and the application; enable the optional relay with --profile turn.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: claude_task
      POSTGRES_PASSWORD: claude_task
      POSTGRES_DB: claude_task
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U claude_task -d claude_task']
      interval: 5s
      timeout: 3s
      retries: 10
  turn:
    image: coturn/coturn:4.18.0-r0
    profiles: [turn]
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/etc/coturn/start.sh']
    environment:
      # Pass through explicit settings without requiring them for inactive profiles.
      # The relay entrypoint validates all three when the service starts.
      VOICE_TURN_HOST:
      VOICE_TURN_SECRET:
      VOICE_TURN_EXTERNAL_IP:
      VOICE_TURN_TLS_PORT: ${VOICE_TURN_TLS_PORT:-}
    ports:
      - '${VOICE_TURN_PORT:-3478}:3478/udp'
      - '${VOICE_TURN_PORT:-3478}:3478/tcp'
      - '30000-30199:30000-30199/udp'
    networks: [voice-relay]
    volumes:
      - ./deploy/turn/start.sh:/etc/coturn/start.sh:ro
      - ./deploy/turn/turnserver.conf:/etc/coturn/base.conf:ro
      - ${VOICE_TURN_CERTS_DIR:-./deploy/turn/certs}:/certs:ro
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=16m']
    cap_drop: [ALL]
    # The upstream turnserver binary carries this file capability, even on high ports.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports: ['3000:3000']
    environment:
      DATABASE_URL: postgres://claude_task:claude_task@db:5432/claude_task
      # Attachment storage: the `data` volume by default, or an S3-compatible bucket.
      STORAGE_TYPE: ${STORAGE_TYPE:-disk}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PREFIX: ${S3_PREFIX:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:?set SECRETS_MASTER_KEY}
      CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.310}
      APP_URL: ${APP_URL:-http://localhost:3000}
      VOICE_STUN_URLS: ${VOICE_STUN_URLS-stun:stun.l.google.com:19302}
      VOICE_TURN_HOST:
      VOICE_TURN_SECRET:
      VOICE_TURN_PORT: ${VOICE_TURN_PORT:-3478}
      VOICE_TURN_TLS_PORT: ${VOICE_TURN_TLS_PORT:-}
      VOICE_TURN_TTL_SECONDS: ${VOICE_TURN_TTL_SECONDS:-86400}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITLAB_URL: ${GITLAB_URL:-https://gitlab.com}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      AGENT_COMMIT_EMAIL_DOMAIN: ${AGENT_COMMIT_EMAIL_DOMAIN:-agents.claude-task.local}
      AGENT_BACKEND_URL: http://app:3000
      AGENT_NETWORK: claude-task-agents
      AGENT_STOP_ON_SHUTDOWN: ${AGENT_STOP_ON_SHUTDOWN:-true}
      AGENT_STOP_WHEN_UNUSED: ${AGENT_STOP_WHEN_UNUSED:-true}
      AGENT_WIKI_IDLE_MINUTES: ${AGENT_WIKI_IDLE_MINUTES:-30}
    stop_grace_period: 30s
    group_add:
      - ${DOCKER_GID:-0}
    networks: [default, agents]
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
networks:
  voice-relay:
  agents:
    name: claude-task-agents
volumes:
  db:
  data:
