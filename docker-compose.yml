# Local production-like stack: Postgres plus the backend image.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: claude_task
      POSTGRES_PASSWORD: claude_task
      POSTGRES_DB: claude_task
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U claude_task -d claude_task']
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports: ['3000:3000']
    environment:
      DATABASE_URL: postgres://claude_task:claude_task@db:5432/claude_task
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:?set SECRETS_MASTER_KEY}
      CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.310}
      AGENT_BACKEND_URL: http://app:3000
      AGENT_NETWORK: claude-task-agents
    group_add:
      - ${DOCKER_GID:-0}
    networks: [default, agents]
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
networks:
  agents:
    name: claude-task-agents
volumes:
  db:
  data:
